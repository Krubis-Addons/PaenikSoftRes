# Release: beim Pushen eines Tags vX.Y.Z (z. B. v0.9.0) baut der BigWigs-Packager das Addon-ZIP
# (Konfiguration in .pkgmeta) und hängt es als GitHub-Release an.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
